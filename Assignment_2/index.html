<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Website</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<header>
    <nav class="navbar">
        <h2 class="logo">Foodie</h2>
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <button class="btn">Order Now</button>
    </nav>
</header>

<!-- Hero Section -->
<section class="hero">
    <div class="hero-text">
        <h1>Delicious Food Delivered</h1>
        <p>Order your favourite meals anytime.</p>
        <button class="btn">Explore Menu</button>
    </div>

    <div class="hero-img">
        <img src="food.png" alt="Food">
    </div>
</section>

<!-- Menu Section -->
<section class="menu-section">
    <h2>Popular Dishes</h2>

    <div class="food-container">

        <div class="food-card">
            <img src="pizza.jpg">
            <h3>Pizza</h3>
            <p>$10</p>
        </div>

        <div class="food-card">
            <img src="burger.jpg">
            <h3>Burger</h3>
            <p>$8</p>
        </div>

        <div class="food-card">
            <img src="pasta.jpg">
            <h3>Pasta</h3>
            <p>$12</p>
        </div>

    </div>
</section>

<!-- Footer -->
<footer>
    <p>© 2026 Foodie Website</p>
</footer>

</body>
</html>
